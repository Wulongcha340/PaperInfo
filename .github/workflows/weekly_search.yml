name: Weekly Academic Paper Search

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 增加权限设置
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Run search script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 这里的变量名必须与脚本一致
        run: python search_papers.py
