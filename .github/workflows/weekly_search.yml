# 周报检索工作流：北京时间每周一 08:11 自动执行（UTC 周一 00:11）。
# 收邮件方式：使用 GitHub 自带通知。请到 GitHub 网页：
#   Settings → Notifications → Actions → 勾选 Email，即可在每次运行完成后收到 GitHub 发出的邮件。
name: Weekly Academic Paper Search

on:
  schedule:
    # UTC 周一 00:11（对应北京时间周一 08:11）
    - cron: '11 0 * * 1'
  workflow_dispatch:

jobs:
  weekly-search:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write  # 用于提交并推送 state.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run search script
        id: search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
        run: python search_papers_enhanced_v2.py --post --log-level INFO

      - name: Upload Downloaded PDFs and weekly_paper_info
        uses: actions/upload-artifact@v4
        with:
          name: weekly-papers-and-info
          path: |
            downloads/**/*.pdf
            downloads/*/weekly_paper_info.md
          if-no-files-found: ignore

      - name: Commit and push state.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "chore: update state.json from workflow [skip ci]" && git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }})
