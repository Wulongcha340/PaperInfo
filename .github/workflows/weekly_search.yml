name: Weekly Academic Paper Search

on:
  schedule:
    # 这里的 cron 表达式表示每周一凌晨 0:00 (UTC) 运行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允许你手动点击按钮触发运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run search script
        run: python search_papers.py
